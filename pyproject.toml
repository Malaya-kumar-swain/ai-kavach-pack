[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kavach-pack"
version = "0.1.0"
description = "Describe an AI system once and get its governance pack: risk tier, system card, DPDP checklist, vendor questions, pre-launch checklist, incident plan and board summary"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Malaya Kumar Swain" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-governance", "responsible-ai", "dpdp", "india", "risk-assessment", "model-card", "compliance", "llm", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kavach-pack = "kavach_pack.__main__:main"

[project.urls]
Homepage = "https://github.com/Malaya-kumar-swain/ai-kavach-pack"
Source = "https://github.com/Malaya-kumar-swain/ai-kavach-pack"
Issues = "https://github.com/Malaya-kumar-swain/ai-kavach-pack/issues"

[tool.setuptools.packages.find]
include = ["kavach_pack*"]

[tool.setuptools.package-data]
kavach_pack = ["*.toml", "examples/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
